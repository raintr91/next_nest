id: hotel-autocomplete
feature: hotel-autocomplete
title: Hotel autocomplete trả label/value
type: api
priority: should
requirementIds:
  - REQ-HOTEL-AUTOCOMPLETE-001
route:
  path: /hotels/autocomplete
  auth: required
setup:
  session: mockAdminSession
data:
  term: Sakura
steps:
  - action: request
    method: GET
    path: /hotels/autocomplete
    query:
      term: Sakura
expected:
  - Response là mảng `{label,value}`.
  - Term rỗng trả `[]`.
mockCases:
  - id: autocomplete-match
    title: Có kết quả
    expected: Trả tên hotel match term.
  - id: autocomplete-empty-term
    title: Term rỗng
    expected: Trả mảng rỗng.
