id: hotel-crawl-setting
feature: hotel-crawl-setting
title: Admin cập nhật crawl setting của hotel
type: e2e
priority: must
requirementIds:
  - REQ-HOTEL-CRAWL-001
route:
  path: /hotels/:id/crawl-setting
  auth: required
testIds:
  required:
    - admin-hotel-crawl-setting-page
    - admin-hotel-crawl-site-controller-select
    - admin-hotel-crawl-interval-select
    - admin-hotel-crawl-timing-input
    - admin-hotel-crawl-save-btn
setup:
  session: mockAdminSession
data:
  hotelId: 101
  interval: 24
  timing: 60
steps:
  - action: goto
    path: /hotels/101/crawl-setting
  - action: select
    testId: admin-hotel-crawl-interval-select
    valueFrom: data.interval
  - action: fill
    testId: admin-hotel-crawl-timing-input
    valueFrom: data.timing
  - action: click
    testId: admin-hotel-crawl-save-btn
expected:
  - PUT `/hotels/{id}/crawl-setting` thành công.
  - Nếu site controller không phải `neppan`, `login_param` được clear.
mockCases:
  - id: crawl-update-success
    title: Update thành công
    expected: Success alert hiển thị.
  - id: crawl-timing-invalid
    title: Timing lớn hơn interval
    expected: Error message theo rule `timing.lte`.
