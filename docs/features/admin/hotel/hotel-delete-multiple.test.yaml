id: hotel-delete-multiple
feature: hotel-delete-multiple
title: Admin xoá nhiều hotel từ list
type: e2e
priority: must
requirementIds:
  - REQ-HOTEL-DELETE-MULTIPLE-001
route:
  path: /hotels
  auth: required
testIds:
  required:
    - admin-hotel-list-page
    - admin-hotel-bulk-delete-btn
setup:
  session: mockAdminSession
steps:
  - action: goto
    path: /hotels
  - action: click
    testId: admin-hotel-select-101
  - action: click
    testId: admin-hotel-bulk-delete-btn
  - action: confirm
    value: true
expected:
  - API nhận `arrId`.
  - Nếu mock có hotel blocked bởi booking, UI hiển thị alert fail.
mockCases:
  - id: bulk-delete-success
    title: Tất cả hotel xoá được
    expected: Selected rows biến mất và success alert hiển thị.
  - id: bulk-delete-blocked
    title: Có hotel đã có booking
    expected: Không row nào bị xoá và hiển thị `message.deleted fail`.
