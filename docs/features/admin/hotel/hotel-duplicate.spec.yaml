id: hotel-duplicate
title: Duplicate hotel admin
status: draft
owner: portal-team
summary: Admin duplicate hotel metadata và các module legacy do admin action copy, sau đó mở edit page của hotel mới.
actors:
  - id: admin
    legacyRoleCode: master
entities:
  - name: Hotel
    table: hotels
  - name: Message
    table: messages
  - name: TargetCustomer
    table: target_customers
requirements:
  - id: REQ-HOTEL-DUPLICATE-001
    title: Duplicate hotel metadata và module liên quan
    description: Duplicate replicate hotel, sinh `code` mới, set `property_id=null`, copy Google Form setting, target customers/plans, messages, templates, rule messages, task messages, message operator targets, multi-language messages và restaurant API keys theo logic legacy.
    priority: should
api:
  endpoints:
    - method: POST
      path: /hotels/{id}/duplicate
      legacyPath: /admin/hotel/duplicate/{id}
      response:
        id: number
        code: string
        redirect_to: /hotels/{id}
acceptance:
  - Hotel mới có `code` mới và `property_id=null`.
  - Các module được copy phải remap foreign keys sang hotel mới, không trỏ lại target/message cũ.
  - Restaurant API keys được copy sang hotel mới nếu hotel nguồn có key.
  - Sau khi copy messages, hệ thống chạy task cập nhật query task message tương đương `process:update-all-query-task-msg --sent-now=1/2`.
  - Sau duplicate UI điều hướng sang `/hotels/{newId}` và hiển thị success message.
openQuestions:
  - id: hotel-duplicate-schema-copy
    question: Multiple schema mới có duplicate schema tenant/resource data hay chỉ copy metadata/module trung tâm?
    tag: "#phase-api"
notes:
  - type: inferredFromCode
    evidence:
      - /home/vutv/workspace/mairy-backend/app/Http/Controllers/Admin/HotelController.php
      - /home/vutv/workspace/mairy-backend/app/Services/HotelService.php
      - /home/vutv/workspace/mairy-backend/resources/views/admin/hotel/group_action.blade.php
    detail: Legacy `duplicate()` dùng Eloquent `replicate()`, reset `code`/`property_id`, rồi gọi `duplicateModules()` để copy setting, target/message graph, restaurant API keys và chạy Artisan update task.
  - type: scope
    detail: Duplicate ở đây là admin action từ `/admin/hotel/duplicate/{id}`; việc copy tenant schema/resource thật của store không được quyết định trong spec này.
