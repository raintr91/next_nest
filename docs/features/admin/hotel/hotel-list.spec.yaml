id: hotel-list
title: Danh sách hotel admin
status: draft
owner: portal-team
summary: Admin xem, tìm kiếm, sort và phân trang metadata hotel theo legacy `/admin/hotel/list`.

codegen:
  profile: list
  entity: hotel
  module: hotels
  namespace: admin-hotel
  skip: []

tags:
  - "#shell: DataListPage"
  - "#pattern: CRUD"
  - "#style: shadcn/ui"
  - "#style: compact"
  - "#style: flat"
  - "#needs-component: cell-managers:MoManagerHandoffPills:managers"
  - "#manual-composable: loginAsStoreManager"
  - "#skip-codegen: page"

actors:
  - id: admin
    legacyRoleCode: master
entities:
  - name: Hotel
    table: hotels
    importantFields:
      - id
      - name
      - code
      - phone
      - chain_id
      - activate_status
      - status
      - created_at
  - name: User
    table: users
    importantFields:
      - id
      - full_name
      - hotel_id
relationships:
  - from: hotels.chain_id
    to: chains.id
    type: many-to-one
  - from: users.hotel_id
    to: hotels.id
    type: one-to-many
requirements:
  - id: REQ-HOTEL-LIST-001
    title: Admin tìm kiếm danh sách hotel
    description: Danh sách hỗ trợ filter `created_at`, `name`, `code`, `chain_name`, `activate_status`; sort theo `name` hoặc `created_at`; mặc định `order_by=created_at`, `sorted_by=desc`, `per_page=100`.
    priority: must
  - id: REQ-HOTEL-LIST-002
    title: Admin thấy action theo từng row
    description: Row hiển thị admin handoff theo từng manager, link crawl setting, view/edit và delete nếu hotel chưa có booking.
    priority: must
ui:
  composition:
    pattern: DataListPage
    overrideCommonPattern: true
  routes:
    - path: /admin/hotels
      legacyPath: /admin/hotel/list
      pageTestId: admin-hotel-list-page
  testIds:
    module: hotels
  filters:
    - name: created_at
      label: Created at
      type: date
    - name: name
      label: 施設名
      type: text_field
    - name: code
      label: 施設コード
      type: text_field
    - name: chain_name
      label: Chain
      type: text_field
    - name: activate_status
      label: Status
      type: select
  columns:
    - key: id
      title: ID
      sortable: true
      align: center
    - key: name
      title: 施設名
      sortable: true
    - key: code
      title: 施設コード
      sortable: false
    - key: chain
      title: Chain
      render: custom
    - key: created_at
      title: Created at
      sortable: true
    - key: managers
      title: Login
      render: custom
  toolbar:
    showTotal: true
    totalLabel: 合計
    defaultPageSize: 100
    pageSizeOptions:
      - 20
      - 40
      - 80
      - 100
  screens:
    - name: Hotel list
      layout:
        - Search card gồm `created_at`, `name`, `code`, `chain_name`, `activate_status`, nút search outline primary và nút clear outline xám căn giữa.
        - "Toolbar tổng nằm tách riêng bên dưới search form, không bọc card/border riêng; thứ tự từ trái qua phải là button tổng số record, nút thêm mới `新規作成`, nút xoá nhiều `削除する`, chọn số record mỗi trang."
        - Table gồm checkbox, ID, hotel name + phone, hotel code, chain name như metadata quan hệ, created_at, admin handoff theo manager, crawl setting icon-only, actions icon-only.
      actions:
        - id: total
          text: 合計
          variant: primary
          position: toolbar extra-actions leftmost
          behavior: button-style readonly, không click, hiển thị text và số trên cùng nền button, không dùng badge bo riêng
          testId: admin-hotel-total-btn
        - id: create
          text: 新規作成
          icon: Plus
          variant: complete
          position: toolbar extra-actions left, trước bulk delete
          testId: admin-hotel-create-btn
        - id: bulk-delete
          text: 削除する
          icon: Trash2
          variant: destructive
          position: toolbar extra-actions sau create
          testId: admin-hotel-bulk-delete-btn
        - id: login-as-manager
          text: manager full_name
          icon: LogIn
          variant: info pill
          position: table column Login
          testId: admin-hotel-login-as-action
        - id: crawl-setting
          text: icon-only
          icon: Settings
          variant: outline
          position: table column Crawl setting
          testIdPattern: admin-hotel-crawl-{id}
        - id: detail
          text: icon-only
          icon: Eye
          variant: ghost
          position: table actions column
          testIdPattern: admin-hotel-view-{id}
        - id: delete
          text: icon-only
          icon: Trash2
          variant: destructive-ghost
          position: table actions column, chỉ khi `can_delete=true`
          testIdPattern: admin-hotel-delete-{id}
api:
  endpoints:
    - method: GET
      path: /hotels
      legacyPath: /admin/hotel/list
      action: list
      query:
        created_at: string|null
        name: string|null
        code: string|null
        chain_name: string|null
        activate_status: number|string|null
        status: number|all|null
        order_by: name|created_at
        sorted_by: asc|desc
        per_page: number
      response:
        data:
          - id: number
            name: string
            phone: string|null
            code: string
            chain:
              id: number|null
              name: string|null
            created_at: string
            managers:
              - id: number
                full_name: string|null
                email: string
            can_delete: boolean
            crawl_setting_url: string
        meta:
          total: number
          current_page: number
          per_page: number
acceptance:
  - Nếu không truyền sort, API dùng `created_at desc` giống legacy.
  - "`ホテル一覧` là menu item trong sidebar; create/detail/edit không là child menu, chỉ đi từ button/action trong list/detail."
  - "Toolbar action dùng icon + text theo `common-buttons` (`新規作成`, `削除する`); table action crawl/detail/delete dùng icon-only theo `common-table-action-column`."
  - Filter `chain_name` tìm theo relation `chain.name`.
  - Row không có chain hiển thị trạng thái tương đương `admin.no chain`.
  - Checkbox delete và action delete chỉ hiển thị/enable khi `bookingExists()` false.
  - Admin handoff theo manager không điều hướng trực tiếp bằng GET render route; action gọi endpoint token riêng và không mô tả UI store portal.
openQuestions:
  - id: hotel-list-tenant-schema
    question: Khi phase API triển khai multiple schema, danh sách admin lấy metadata hotel từ schema trung tâm hay cần trạng thái đồng bộ với schema tenant?
    tag: "#phase-api"
notes:
  - type: inferredFromCode
    evidence:
      - /home/vutv/workspace/mairy-backend/routes/admin.php
      - /home/vutv/workspace/mairy-backend/app/Http/Controllers/Admin/HotelController.php
      - /home/vutv/workspace/mairy-backend/app/Services/HotelService.php
      - /home/vutv/workspace/mairy-backend/resources/views/admin/hotel/index.blade.php
    detail: Legacy `index()` lấy input query, set sort mặc định, gọi `HotelService::paginate()`, load `chain` và `manager`, view render search/table/actions.
  - type: scope
    detail: Spec này chỉ bao phủ trang admin hotel list. `chain` chỉ là relationship/filter metadata trong admin; không bao phủ chain portal hoặc store portal.
  - type: inferredFromCode
    evidence:
      - /home/vutv/workspace/mairy-backend/resources/views/admin/partials/menu_left.blade.php
      - /home/vutv/workspace/mairy-backend/resources/lang/ja/admin.php
    detail: Legacy sidebar dùng cụm `ホテル管理` và child `ホテル一覧`; create nằm trong toolbar/list action, không phải menu child.
  - type: decision
    detail: "#legacy-global-ui-violation Legacy table action có thể render text `詳細`/`設定`/`削除する`; UI mới giữ table action icon-only."
