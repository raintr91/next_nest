id: hotel-form-options
title: Dữ liệu phụ trợ form hotel
status: draft
owner: portal-team
summary: SPA admin hotel create/update lấy options thật từ API dữ liệu phụ trợ, không dùng GET render page kiểu legacy.
actors:
  - id: admin
    legacyRoleCode: master
entities:
  - name: User
    table: users
    importantFields:
      - id
      - email
      - active
      - hotel_id
      - role
  - name: Chain
    table: chains
    importantFields:
      - id
      - name
  - name: Country
    table: countries
    importantFields:
      - id
      - kanji_name
      - name
  - name: ApiSystem
    table: ms_api_systems
requirements:
  - id: REQ-HOTEL-FORM-OPTIONS-001
    title: Form hotel có đủ options phụ trợ
    description: Create/update cần manager user options, chain options như metadata quan hệ của hotel, SMS country options, API system options, hotel code mặc định khi create và restaurant API keys khi update.
    priority: must
ui:
  routes:
    - path: /hotels/create
      legacyPath: /admin/hotel/create
      pageTestId: admin-hotel-create-page
    - path: /hotels/:id
      legacyPath: /admin/hotel/update/{id}
      pageTestId: admin-hotel-detail-page
    - path: /hotels/:id/edit
      legacyPath: /admin/hotel/update/{id}
      pageTestId: admin-hotel-edit-page
api:
  endpoints:
    - method: GET
      path: /hotels/form-options
      legacyPath: /admin/hotel/create
      query:
        hotel_id: number|null
      response:
        code: string|null
        manager_user_options:
          - id: number
            email: string
            active: boolean
            disabled: boolean
            selected: boolean
        chain_options:
          - id: number
            name: string
        sms_country_options:
          - id: number
            name: string
            required: boolean
        api_system_options:
          - id: number
            name: string
        restaurant_api_key: string|null
      note: Endpoint này chỉ trả dữ liệu phụ trợ cho SPA; không phải API render `/hotels/create` hoặc `/hotels/{id}`.
acceptance:
  - Create mode trả `code` sinh theo rule legacy `BHT` + timestamp hoặc rule mới tương đương được quyết định ở backend.
  - Update mode include manager đang gán cho hotel và user manager active chưa gán hotel khác.
  - Country Japan luôn có trong `sms_to_countries` và UI không cho bỏ chọn.
  - Inactive/không hợp lệ option nếu được trả về phải có `disabled=true` để UI hiển thị nhưng không cho chọn.
openQuestions:
  - id: hotel-code-generation
    question: API mới có giữ format `BHT{timestamp}` của `HotelService::genHotelCode()` hay chuyển sang generator tenant-safe?
    tag: "#phase-api"
notes:
  - type: inferredFromCode
    evidence:
      - /home/vutv/workspace/mairy-backend/app/Http/Controllers/Admin/HotelController.php
      - /home/vutv/workspace/mairy-backend/app/Services/UserService.php
      - /home/vutv/workspace/mairy-backend/app/Services/HotelService.php
      - /home/vutv/workspace/mairy-backend/resources/views/admin/hotel/form.blade.php
    detail: Legacy create/edit render options trong Blade qua `listUserCanForHotel`, `listChainForHotel`, `getListCountryCanSendMessage`, `apiSystemService->getList()` và restaurant API keys.
  - type: scope
    detail: "`chain_options` chỉ phục vụ admin gán hotel vào chain trong form hotel; không mô tả chain portal hoặc chức năng quản lý chain."
