id: hotel-analytics-export
title: Export CSV analytics hotel
status: draft
owner: portal-team
summary: Admin tải CSV báo cáo survey/message toàn bộ hotel theo cùng filter ngày của analytics.
actors:
  - id: admin
    legacyRoleCode: master
entities:
  - name: MessageTracking
    table: message_trackings
  - name: LinkSurvey
    table: link_surveys
requirements:
  - id: REQ-HOTEL-ANALYTICS-EXPORT-001
    title: Tải CSV analytics
    description: CSV dùng `TrackerService::getDataExportCSV(start,end)`, encode `SJIS-win`, filename theo khoảng ngày legacy.
    priority: should
api:
  endpoints:
    - method: GET
      path: /hotels/analytics/export
      legacyPath: /admin/hotel/analytics/export
      query:
        start: string
        end: string
      response:
        contentType: text/csv
        encoding: SJIS-win
        fileName: string
validation:
  fields:
    - key: start
      rules: required date date_format FORMAT_DATE
    - key: end
      rules: required date date_format FORMAT_DATE after_or_equal:start
acceptance:
  - CSV download giữ cùng query `start`/`end` với analytics page.
  - Response encode `SJIS-win` và header `Content-Disposition` có filename `【YYYY/MM/DD-YYYY/MM/DD】全施設のアンケートデータ.csv`.
openQuestions: []
notes:
  - type: inferredFromCode
    evidence:
      - /home/vutv/workspace/mairy-backend/app/Http/Controllers/Admin/HotelController.php
      - /home/vutv/workspace/mairy-backend/app/Http/Requests/AdminTrackingAnalyticsSearchRequest.php
    detail: Legacy `export()` tạo CSV bằng League CSV, convert SJIS-win, trả `text/csv`.
