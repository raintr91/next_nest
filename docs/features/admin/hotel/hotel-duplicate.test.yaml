id: hotel-duplicate
feature: hotel-duplicate
title: Admin duplicate hotel
type: e2e
priority: should
requirementIds:
  - REQ-HOTEL-DUPLICATE-001
route:
  path: /hotels/:id
  auth: required
testIds:
  required:
    - admin-hotel-detail-page
    - admin-hotel-duplicate-action
setup:
  session: mockAdminSession
steps:
  - action: goto
    path: /hotels/101
  - action: click
    testId: admin-hotel-duplicate-action
  - action: confirm
    value: true
expected:
  - API tạo hotel mới với `code` khác và `property_id=null`.
  - UI điều hướng sang `/hotels/{newId}`.
mockCases:
  - id: duplicate-success
    title: Duplicate thành công
    expected: Detail mới hiển thị success message và code mới.
