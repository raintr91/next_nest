id: hotel-create-success
feature: hotel
title: Create hotel successfully
type: e2e
priority: must
requirementIds:
  - REQ-HOTEL-002
route:
  path: /admin/hotels/create
  auth: required
testIds:
  required:
    - hotel-create-page
    - hotel-name-input
    - hotel-save-btn
    - app-toast-message
setup:
  session: mockAuthenticatedSession
  mocks:
    - method: POST
      path: /api/hotels
      response: hotelCreateSuccess
data:
  hotelName: Hotel Sakura
steps:
  - action: goto
    path: /admin/hotels/create
  - action: fill
    testId: hotel-name-input
    valueFrom: data.hotelName
  - action: click
    testId: hotel-save-btn
assertions:
  ui:
    - testId: app-toast-message
      contains: Created
    - url: /admin/hotels
  semantic:
    ready:
      rootTestId: hotel-create-page
      waitForFonts: true
      waitForImages: visible
    level1:
      - toHaveNoConsoleErrors
      - toHaveNoHorizontalScroll
      - toHaveNoBrokenImages
      - toHaveNoTextOverflow
    accessibility:
      - toHaveNoA11yViolations
      - toHaveValidAccessibleNames
expected:
  - Success toast is visible.
  - User returns to hotel list.
