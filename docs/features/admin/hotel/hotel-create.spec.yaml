id: hotel-create
title: Tạo hotel admin
status: draft
owner: portal-team
summary: Admin tạo hotel metadata mới, khai báo thông tin định danh, billing, integration, option và gán manager user.

codegen:
  profile: create
  entity: hotel
  module: hotels
  namespace: admin-hotel
  skip:
    - models
    - service
    - mock

tags:
  - "#shell: DataFormPage"
  - "#pattern: CRUD"
  - "#style: shadcn/ui"
  - "#style: compact"
  - "#style: flat"
  - "#skip-codegen: page"

actors:
  - id: admin
    legacyRoleCode: master
entities:
  - name: Hotel
    table: hotels
  - name: User
    table: users
  - name: RestaurantApiKey
    table: restaurant_api_keys
  - name: HotelSetting
    table: hotel_settings
requirements:
  - id: REQ-HOTEL-CREATE-001
    title: Admin tạo hotel với contract legacy
    description: Payload giữ nguyên field legacy của `hotels` và các field phụ trợ như `master_user_hotel`, `api_key_restaurant`, `google_form_response_url`, `api_ids`, `sms_to_countries`.
    priority: must
  - id: REQ-HOTEL-CREATE-002
    title: Hệ thống gán manager và side effects sau create
    description: Sau create, hệ thống set `users.hotel_id`, tạo `hotel_page_review` token, lưu restaurant API keys, lưu Google Form URL vào `hotel_settings`, sync `hotel_api`.
    priority: must
ui:
  composition:
    pattern: custom
    overrideCommonPattern: true
  routes:
    - path: /admin/hotels/create
      legacyPath: /admin/hotel/create
      pageTestId: admin-hotel-create-page
  testIds:
    module: hotels
  form:
    fields:
      - key: name
        label: 施設名
        type: text
        required: true
      - key: code
        label: 施設コード
        type: text
        required: true
      - key: phone
        label: Phone
        type: text
        required: true
      - key: address
        label: Address
        type: text
        required: true
  screens:
    - name: Hotel create form
      header:
        title: ホテル登録
        legacyCardTitle: hotel registration
        description: Legacy `/admin/hotel/create` hiển thị một `card card-default` lớn; card header là `hotel registration`, card body render trực tiếp `form.blade.php` và không include `group_action`.
      layout:
        - Page create dùng một card lớn legacy-like, không chia identity/billing/integration/options/manager thành nhiều Card riêng.
        - "Form dùng layout `row has_validate` giống legacy: cột trái rộng tương đương `col-lg-6`, cột phải tương đương `col-lg-3`; còn lại là khoảng trống theo layout cũ."
        - "Cột trái field order theo legacy: `name` + `sub_name` ở nửa trái, `is_show_name_in_scenario` ở nửa phải; `code` readonly + `activate_status`; `phone` + `fax`; `state` + `city`; `address` rộng 9/12 + `zip_code` rộng 3/12."
        - "Cột trái billing giữ row radio: `independence`, `billing_address`, `payment_type`; tiếp theo row numeric/date gồm `initial_cost`, `monthly_fee`, `commission_rate`, `start_billing`."
        - "Integration row giữ thứ tự legacy: `connected_3daikan` radio bên trái, `api_key_3daikan` readonly input-group bên phải kèm button reset API key primary; `use_restaurant` radio bên trái, `api_key_restaurant` input disabled cho tới khi bật Toreta; `connected_crawler` radio bên trái, `note` textarea bên phải."
        - "Google/API row: `google_form_response_url` full width; kế tiếp `api_ids[]` select2-like ở 4/12 và `property_id` ở 8/12."
        - Options section nằm sau API row trong cột trái với heading `hotel option`; dùng switch legacy hidden checkbox `state_message` + label `state_message_click` cho `is_scenario_option` và `is_show_softbank_url`; `hotel_cd` nằm cùng row với SoftBank option.
        - "Cột phải field order theo legacy: `master_user_hotel[]` select2 multiple trong input-group, append nút plus để mở quick-create manager inline panel; `chain_id` select2; `person_charge` + `person_charge_email`; `japan_sale`; `notification_mail_address`; `sms_to_countries` switch checkbox list; save/registration button cuối cột phải."
        - Quick-create manager không dùng legacy modal; khi bấm plus, hiển thị inline panel ngay dưới `master_user_hotel[]` trong cột phải để tránh modal thừa và tránh modal chồng modal.
        - Create route không render các group action `hotel list`, delete, Edit, duplicate ở đầu card; các action đó chỉ thuộc update route.
        - Create form mặc định editable; `code` readonly, `api_key_3daikan` readonly, `api_key_restaurant` disabled khi `use_restaurant` chưa bật, Japan trong `sms_to_countries` luôn bắt buộc/không bỏ được.
        - Select/multi-select phải là select2-like control thay vì checkbox grid; chỉ option/SMS dùng switch-like checkbox.
        - Inline validation nằm sát field và request message nằm trên form như `Form::requestMessage()`.
      formActions:
        - id: save
          text: 登録
          loadingText: 保存中...
          icon: Save
          variant: complete
          position: cuối cột phải của form, width block, không đặt ở page header
          testId: admin-hotel-save-btn
      blocks:
        - id: identity
          layout: cột trái, các row đầu của legacy form
          fields:
            - key: name
              label: 施設名
              required: true
              maxLength: 150
            - key: sub_name
              label: サイトコントローラー表示名
              required: false
              maxLength: 500
            - key: code
              label: 施設コード
              required: true
              readonly: true
            - key: activate_status
              label: status hotel
              control: select2-like select
            - key: phone
              required: true
            - key: address
              required: true
              maxLength: 255
        - id: billing
          layout: cột trái, sau address row
          fields:
            - key: independence
              control: radio group
            - key: billing_address
              control: radio group
            - key: payment_type
              control: radio group
            - key: initial_cost
              validation: nullable numeric between 0.00 and 999999999.99
            - key: monthly_fee
              validation: nullable numeric between 0.00 and 999999999.99
            - key: commission_rate
            - key: start_billing
              control: monthpicker-like input
        - id: integration
          layout: cột trái, sau billing row
          fields:
            - key: connected_3daikan
              control: radio group
            - key: api_key_3daikan
              control: readonly input-group with reset button
              validation: nullable alpha_num max 255
            - key: use_restaurant
              control: radio group
            - key: api_key_restaurant
              control: disabled text input until `use_restaurant` enabled
              validation: required min 9 max 300 khi `use_restaurant` enabled
            - key: connected_crawler
              control: radio group
            - key: note
              control: textarea rows=2
            - key: google_form_response_url
              control: full-width text input
              validation: nullable url
            - key: api_ids
              control: select2-like select, name `api_ids[]`
            - key: property_id
              validation: nullable max 100 unique khi có giá trị
        - id: options
          layout: cột trái, sau API row, heading `hotel option`
          fields:
            - key: is_show_name_in_scenario
              control: checkbox
            - key: is_scenario_option
              control: switch-like hidden checkbox + `state_message_click`
            - key: is_show_softbank_url
              control: switch-like hidden checkbox + `state_message_click`
            - key: hotel_cd
              validation: required string max 255 khi `is_show_softbank_url` enabled
        - id: manager-assignment
          layout: cột phải
          fields:
            - key: master_user_hotel
              type: select2-like multi-select with input-group plus button opening inline quick-create panel
            - key: chain_id
              control: select2-like select
            - key: person_charge
              maxLength: 255
            - key: person_charge_email
              maxLength: 255
            - key: notification_mail_address
              maxLength: 255
              validation: Nếu có giá trị, split dấu phẩy và từng email trim phải hợp lệ.
            - key: sms_to_countries
              type: switch-like checkbox-list, Japan bắt buộc
api:
  endpoints:
    - method: POST
      path: /hotels
      legacyPath: /admin/hotel/create
      action: create
      request:
        name: string
        sub_name: string|null
        code: string
        phone: string
        fax: string|null
        address: string
        state: string|null
        city: string|null
        zip_code: string|null
        activate_status: number|string|null
        independence: number|string
        billing_address: number|string
        payment_type: number|string
        initial_cost: number|null
        monthly_fee: number|null
        commission_rate: number|null
        start_billing: string|null
        connected_3daikan: number
        api_key_3daikan: string|null
        use_restaurant: number
        api_key_restaurant: string|null
        connected_crawler: number
        google_form_response_url: string|null
        api_ids: number[]
        property_id: string|null
        is_show_name_in_scenario: number
        is_scenario_option: number
        is_show_softbank_url: number
        hotel_cd: string|null
        master_user_hotel: number[]
        chain_id: number|null
        person_charge: string|null
        person_charge_email: string|null
        japan_sale: string|null
        notification_mail_address: string|null
        sms_to_countries: number[]
      response:
        id: number
        code: string
        assigned_user_ids: number[]
acceptance:
  - Thiếu `name`, `code`, `phone`, `address` bị validation error.
  - UI create dùng một card lớn `hotel registration` và form layout legacy-like; không đặt save trong page header và không chia form thành nhiều card section hiện đại.
  - Save/registration button nằm cuối cột phải, variant complete, full/block width tương đương legacy `btn btn-block btn-complete rounded`.
  - Field order, select2-like controls, input-group plus manager button, API key reset button, option switch và SMS country switch phải bám legacy `form.blade.php`, nhưng quick-create manager dùng inline panel theo common flat design thay vì legacy modal.
  - "`notification_mail_address` sai format trả message `メールアドレスが不正です。`."
  - Nếu `is_show_softbank_url=0`, backend set `hotel_cd=null`.
  - Nếu `sms_to_countries` không gửi hoặc thiếu Japan, backend vẫn thêm `COUNTRY_JAPAN_ID`.
  - Không cho chọn user role chain vào `master_user_hotel`; legacy trả lỗi `登録に失敗しました。他のユーザーをお試しください。`.
openQuestions:
  - id: hotel-create-schema-provisioning
    question: Create hotel mới có cần tạo tenant schema ngay trong API này hay phase provisioning riêng?
    tag: "#phase-api"
notes:
  - type: inferredFromCode
    evidence:
      - /home/vutv/workspace/mairy-backend/app/Http/Requests/HotelStoreRequest.php
      - /home/vutv/workspace/mairy-backend/app/Services/HotelService.php
      - /home/vutv/workspace/mairy-backend/app/Http/Controllers/Admin/HotelController.php
      - /home/vutv/workspace/mairy-backend/resources/views/admin/hotel/form.blade.php
    detail: Legacy create POST dùng `HotelStoreRequest`, `HotelService::store()`, sau đó `insertHotelPageToken()`.
  - type: decision
    detail: "#legacy-global-ui-violation Legacy plus button mở `admin.user.modal`; UI mới dùng inline quick-create manager panel để hạn chế modal và tránh nested modal."
  - type: scope
    detail: Spec chỉ bao phủ admin create hotel metadata và các side effect do admin action tạo ra; không bao phủ store portal setup screens.
