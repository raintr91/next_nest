id: hotel-create-manager-user
feature: hotel-create-manager-user
title: Tạo nhanh manager user trong hotel form
type: e2e
priority: should
requirementIds:
  - REQ-HOTEL-CREATE-MANAGER-001
route:
  path: /hotels/create
  auth: required
testIds:
  required:
    - admin-hotel-create-page
    - admin-hotel-add-manager-user-action
    - admin-hotel-manager-email-input
    - admin-hotel-manager-password-input
    - admin-hotel-manager-save-btn
setup:
  session: mockAdminSession
data:
  email: manager@example.com
  password: Abcdef12345!
  fullName: Store Manager
  address: Tokyo
steps:
  - action: goto
    path: /hotels/create
  - action: click
    testId: admin-hotel-add-manager-user-action
  - action: fill
    testId: admin-hotel-manager-email-input
    valueFrom: data.email
  - action: fill
    testId: admin-hotel-manager-password-input
    valueFrom: data.password
  - action: click
    testId: admin-hotel-manager-save-btn
expected:
  - Tạo user thành công thêm option vào `master_user_hotel`.
mockCases:
  - id: manager-create-success
    title: Tạo manager thành công
    expected: Option mới xuất hiện và được chọn.
  - id: manager-email-duplicate
    title: Email trùng
    expected: Modal hiển thị error message.
