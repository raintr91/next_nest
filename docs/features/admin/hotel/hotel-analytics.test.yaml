id: hotel-analytics
feature: hotel-analytics
title: Admin xem hotel analytics
type: e2e
priority: should
requirementIds:
  - REQ-HOTEL-ANALYTICS-001
route:
  path: /hotels/analytics
  auth: required
testIds:
  required:
    - admin-hotel-analytics-page
    - admin-hotel-analytics-start-input
    - admin-hotel-analytics-end-input
    - admin-hotel-analytics-search-btn
    - admin-hotel-analytics-clear-btn
    - admin-hotel-analytics-pdf-btn
    - admin-hotel-analytics-csv-btn
    - admin-hotel-analytics-report-table
setup:
  session: mockAdminSession
data:
  start: "2026-06-01"
  end: "2026-06-30"
steps:
  - action: goto
    path: /hotels/analytics
  - action: fill
    testId: admin-hotel-analytics-start-input
    valueFrom: data.start
  - action: fill
    testId: admin-hotel-analytics-end-input
    valueFrom: data.end
  - action: click
    testId: admin-hotel-analytics-search-btn
  - action: assert-layout
    target: filter
    expected: date range centered, search/clear centered below period input
  - action: assert-layout
    target: report
    expected: title left, PDF/CSV primary buttons right, overview table 8 columns and 3 rows
assertions:
  ui:
    - testId: admin-hotel-analytics-page
      contains: MAIRY survey report
    - testId: admin-hotel-analytics-report-table
      contains: 宿泊前
expected:
  - API trả các metric before/after/survey/company survey.
  - UI render legacy survey-table-overview, không render metric card grid.
  - CSV/PDF download được kiểm ở spec child `hotel-analytics-export` và `hotel-analytics-download-pdf`.
mockCases:
  - id: analytics-data
    title: Có dữ liệu
    expected: Metrics và rate hiển thị.
  - id: analytics-empty
    title: Không có dữ liệu
    expected: UI hiển thị `－` cho metric thiếu.
