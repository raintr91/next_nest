feature:
  id: example-contract-pilot
  title: Contract pilot API
  status: draft
  version: 0.1.0
  source:
    portalIrSpec: ../ir/spec.yaml

approval:
  status: approved

codegen:
  module: Example
  entity: SampleItem
  profile: crud-standard
  orm: typeorm
  wire:
    search: true
    detail: false
    create: true
    update: true
    delete: true
  skip: []
  commands: []

tags:
  - "#gen:module"
  - "#gen:crud"
  - "#gen:orm"
  - "#gen:test-unit"

modules:
  - name: Example
    entities:
      - name: SampleItem
        table: sample_items
        fields:
          - name: id
            type: integer
            readOnly: true
          - name: name
            type: string
        relationships:
          - name: managers
            type: hasMany
            target: User

api:
  endpoints:
    - id: sample-item.search
      module: Example
      action: search
      method: GET
      path: /sample-items
      request: SampleItemSearchRequest
      response: SampleItemCollection
    - id: sample-item.create
      module: Example
      action: create
      method: POST
      path: /sample-items
      request: SampleItemCreateRequest
      response: SampleItemResource
    - id: sample-item.update
      module: Example
      action: update
      method: PATCH
      path: /sample-items/{id}
      request: SampleItemUpdateRequest
      response: SampleItemResource
    - id: sample-item.delete
      module: Example
      action: delete
      method: DELETE
      path: /sample-items/{id}
      response: SampleItemDeleteResponse

requests:
  SampleItemSearchRequest:
    fields:
      - name: page
        type: integer
      - name: per_page
        type: integer
  SampleItemCreateRequest:
    fields:
      - name: name
        type: string
  SampleItemUpdateRequest:
    fields:
      - name: name
        type: string
        nullable: true

responses:
  SampleItemResource:
    fields:
      - name: id
        type: integer
      - name: name
        type: string
        nullable: true
  SampleItemCollection:
    envelope: ApiResponse
    data: array of SampleItemResource
  SampleItemDeleteResponse:
    fields:
      - name: success
        type: boolean
