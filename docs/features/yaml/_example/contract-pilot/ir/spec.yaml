# Guinea pig — contract:gen dry only (not a shipping feature)
id: example-contract-pilot
title: Contract gen pilot
status: draft
owner: portal-team
summary: Validates contract:gen field registry output

codegen:
  profile: list
  entity: sample-item
  module: sample-items

entities:
  - name: SampleItem
    table: sample_items
    fields:
      - key: id
        kind: scalar
        type: integer
        scopes: [response, persistence]
        readOnly: true
      - key: name
        kind: scalar
        type: string
        scopes: [form, response, persistence]
      - key: managers
        kind: relation
        cardinality: many
        target: User
        scopes: [response]
        persistence:
          type: hasMany
          orm: typeorm
        contract:
          read:
            includeOn: [list]
            embed: [id, full_name]

ui:
  composition:
    pattern: DataListPage
  columns:
    - key: name
    - key: managers
  testIds:
    module: sample-items

api:
  endpoints:
    - method: GET
      path: /sample-items
      action: list
