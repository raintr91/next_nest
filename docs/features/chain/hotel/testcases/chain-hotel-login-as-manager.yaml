id: chain-hotel-login-as-manager
feature: chain-hotel
title: Chain login as manager mở store tab
type: e2e
priority: must
requirementIds:
  - REQ-CHAIN-HOTEL-LOGIN-AS-001
  - REQ-CHAIN-HOTEL-LOGIN-AS-002
route:
  path: /hotels
  auth: chain
testIds:
  required:
    - chain-hotels-page
    - chain-hotels-cell-managers
  patterns:
    - chain-hotels-cell-managers-login-as-{{manager_id}}
setup:
  session: mockChainAuthenticatedSession
  mocks:
    - method: POST
      path: /api/auth/store/login-from-admin
      response: storeLoginFromAdminSuccess
data:
  manager_id: "{{manager_id}}"
steps:
  - action: goto
    path: /hotels
  - action: waitFor
    testId: chain-hotels-table
assertions:
  network:
    - method: POST
      path: /api/auth/store/login-from-admin
      bodyContains:
        id: "{{manager_id}}"
  ui:
    - action: newTabOpened
      urlContains: /store/
expected:
  - Tab store mở với token và hotel_name trong query.
  - Manager full_name mairy không có testId handoff.
