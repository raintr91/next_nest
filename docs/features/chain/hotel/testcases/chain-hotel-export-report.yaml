id: chain-hotel-export-report
feature: chain-hotel
title: Chain tải báo cáo 開封率データ
type: e2e
priority: must
requirementIds:
  - REQ-CHAIN-HOTEL-EXPORT-001
  - REQ-CHAIN-HOTEL-EXPORT-002
route:
  path: /hotels
  auth: chain
testIds:
  required:
    - chain-hotels-export-month-input
    - chain-hotels-export-report-btn
setup:
  session: mockChainAuthenticatedSession
  mocks:
    - method: GET
      path: /api/hotels
      response: chainHotelListSuccess
    - method: POST
      path: /api/hotels/export-report
      response: chainHotelExportReportSuccess
data:
  month: "{{last_month_yyyy_mm}}"
steps:
  - action: goto
    path: /hotels
  - action: fill
    testId: chain-hotels-export-month-input
    value: "{{last_month_yyyy_mm}}"
  - action: click
    testId: chain-hotels-export-report-btn
assertions:
  network:
    - method: POST
      path: /api/hotels/export-report
      bodyContains:
        month: "{{last_month_yyyy_mm}}"
expected:
  - Response file download xlsx; filename chứa 開封率月次報告.
