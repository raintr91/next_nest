# Backend API spec template (in-repo)

Feature folder: `docs/features/yaml/{role}/{domain}/{function}/backend/`

Copy to `01-backend-spec.yaml` via `/api-spec`. Portal FE contract: sibling `../ir/spec.yaml`.

See `~/workspace/api/docs/templates/backend-api.yaml` for full field reference.

```yaml
feature:
  id: role-domain-function
  title: Feature Title
  status: draft
  version: 0.1.0
  source:
    portalIrSpec: ../ir/spec.yaml
    updatedAt: YYYY-MM-DD
    portalRefs: []

approval:
  status: draft

codegen:
  module: Admin
  entity: FeatureEntity
  profile: crud-standard
  orm: typeorm   # typeorm | prisma
  wire:
    search: true
    detail: true
    create: true
    update: false
    delete: false
  skip: []
  commands: []

modules:
  - name: Admin
    entities:
      - name: FeatureEntity
        table: feature_entities
        fields:
          - name: id
            type: integer
            readOnly: true
        relationships: []

api:
  endpoints: []

requests: {}
responses: {}
```

Render review md: `pnpm docs:render` (when backend render script wired).
